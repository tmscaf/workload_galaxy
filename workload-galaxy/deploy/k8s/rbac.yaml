# Read-only access for the collector. Secrets are deliberately absent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-galaxy
---
# The node agent talks only to the collector; it needs no API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: galaxy-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-galaxy-reader
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, nodes, namespaces, replicationcontrollers]
    verbs: [get, list, watch]
  # Diagnostics: why a deployment is failing. Events carry the API server's, scheduler's and kubelet's
  # own explanations; claims and quotas explain pods that never appear. (Pod logs are NOT granted here:
  # see optional-pod-logs.yaml.)
  - apiGroups: [""]
    resources: [events, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets, controllerrevisions]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  # OpenShift (ignored on vanilla Kubernetes)
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [apps.openshift.io]
    resources: [deploymentconfigs]
    verbs: [get, list, watch]
  - apiGroups: [project.openshift.io]
    resources: [projects]
    verbs: [get, list]
  - apiGroups: [config.openshift.io]
    resources: [clusteroperators, clusterversions]
    verbs: [get, list, watch]
  - apiGroups: [machineconfiguration.openshift.io]
    resources: [machineconfigpools]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workload-galaxy-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-galaxy-reader
subjects:
  - kind: ServiceAccount
    name: workload-galaxy
    namespace: workload-galaxy
