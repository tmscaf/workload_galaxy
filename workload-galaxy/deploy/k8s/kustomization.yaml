# Base install. The agent token Secret is NOT here (create it out of band):
#   kubectl -n workload-galaxy create secret generic galaxy-agent-token \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workload-galaxy
resources:
  - rbac.yaml
  - config.yaml
  - collector.yaml
  - agent.yaml
images:
  - name: workload-galaxy
    newName: workload-galaxy
    newTag: latest
