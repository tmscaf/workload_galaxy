# Base install. Nothing else is required: with no settings the module starts unconfigured and is
# given its host from the suite's Settings page. Optional, all in the same namespace:
#   Secret    esxi-galaxy-settings   key: token (the settings token shared with the suite shell)
#   ConfigMap esxi-galaxy-config     ESXIGALAXY_* settings, for deployments that set them here
#   Secret    esxi-galaxy-host       keys: user, password (the read-only account), likewise
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - esxi-galaxy.yaml
