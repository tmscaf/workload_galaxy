name: CLA

# Asks each outside contributor to sign CLA.md once, by commenting on their pull request, and
# records who signed and when. A pull request shows a failed "CLA" check until its authors have signed.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - name: Check signatures
        if: >-
          github.event_name == 'pull_request_target'
          || github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # contributor-assistant/github-action v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/tmscaf/workload_galaxy/blob/main/CLA.md
          # Signatures are kept on their own branch, so rules that protect main do not block them.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          allowlist: tmscaf,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
