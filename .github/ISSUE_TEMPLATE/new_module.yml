name: A new module
description: Something else the suite could map (a hypervisor, a cloud account, a storage system).
labels: [module]
body:
  - type: input
    id: what
    attributes:
      label: What it would watch
    validations: {required: true}
  - type: textarea
    id: map
    attributes:
      label: What would be on the map
      description: What are the things (the stars), what groups them (the arms), what do they sit on, and what connects them?
    validations: {required: true}
  - type: textarea
    id: findings
    attributes:
      label: What it should tell you is wrong
      description: The problems someone running this system actually loses time to.
    validations: {required: true}
  - type: textarea
    id: source
    attributes:
      label: How it would be read
      description: The API or protocol, and the least access it needs. Read-only is the rule.
    validations: {required: true}
  - type: checkboxes
    id: help
    attributes:
      label: Can you help
      options:
        - label: I can test against a real one.
        - label: I would like to build it.
