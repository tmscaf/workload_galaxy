name: Something is wrong
description: A module shows the wrong thing, misses something, or breaks.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [Kubernetes module, Network module, ESXi module, Suite bar or Settings, Shared core, Something else]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      description: The chip next to the module's name, or /api/v1/version.
      placeholder: 0.12.0 (build 20261125.0334)
    validations: {required: true}
  - type: textarea
    id: saw
    attributes:
      label: What you saw
      description: What the page said or did. A screenshot helps; hide anything private first.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The fewest steps that show it. If it happens on the built-in demo or sample data, say which.
  - type: textarea
    id: where
    attributes:
      label: Where it runs
      description: What the module is watching (Kubernetes or OpenShift version, router, ESXi version) and how it is deployed.
  - type: checkboxes
    id: private
    attributes:
      label: Before you post
      options:
        - label: I removed addresses, host names, account names and tokens I do not want public.
          required: true
