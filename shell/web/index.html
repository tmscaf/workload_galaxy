<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workload Galaxy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%2390e0ff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%239b7bff' stroke-width='2' transform='rotate(-25 16 16)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <header id="bar">
    <a class="brand" href="https://github.com/tmscaf/workload_galaxy" target="_blank" rel="noopener" title="Workload Galaxy on GitHub: source code, documentation and licence">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.5" fill="var(--core)"/><ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="var(--violet)" stroke-width="1.6" transform="rotate(-25 16 16)"/><circle cx="27" cy="11" r="1.6" fill="var(--cyan)"/></svg>
      <span class="title">Workload Galaxy</span>
    </a>
    <div class="picker">
      <button id="modButton" class="mod-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="modMenu" title="Switch module">
        <span id="modDot" class="dot off"></span><span id="modName">Modules</span>
        <span id="modBadge" class="badge" hidden></span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <ul id="modMenu" class="menu" role="listbox" aria-label="Modules" hidden></ul>
    </div>
    <span id="modWhere" class="chip" hidden></span>
    <div class="spacer"></div>
    <span id="modState" class="state"></span>
    <a id="modOpen" class="open" target="_blank" rel="noopener" hidden title="Open this module in its own tab">Open on its own ↗</a>
    <button id="settingsButton" class="bar-btn" aria-pressed="false" title="Where each module gets its data from">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 6h7m4 0h3M3 14h3m4 0h7"/><circle cx="12" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="14" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      Settings</button>
  </header>

  <main id="stage">
    <iframe id="frame" title="Module" hidden></iframe>
    <section id="notice" hidden></section>
    <section id="settings" hidden aria-label="Settings"></section>
  </main>

  <script type="module" src="js/shell.js"></script>
</body>
</html>
